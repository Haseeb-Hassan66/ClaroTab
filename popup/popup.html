<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ClaroTab</title>
  <!-- Inter is loaded locally from the OS font stack (defined in popup.css) –
       no external network fetch needed, so the popup paints instantly. -->
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header>
    <div class="header-row">
      <div class="brand">
        <svg class="brand-mark" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="20" height="20" rx="5" fill="url(#bm-grad)"/>
          <path d="M13.5 7.2A4 4 0 1 0 13.5 12.8" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <defs>
            <linearGradient id="bm-grad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fed7aa"/>
              <stop offset="50%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#9a3412"/>
            </linearGradient>
          </defs>
        </svg>
        <h1>ClaroTab</h1>
      </div>
      <button id="settings-btn" title="Settings" aria-label="Open ClaroTab settings"></button>
    </div>
    <p id="status">Loading tabs…</p>
  </header>

  <nav id="tabs-nav">
    <button class="nav-btn active" data-view="tabs">Tabs</button>
    <button class="nav-btn" data-view="sessions">Sessions</button>
  </nav>

  <div id="tabs-view">
    <div id="ai-banner" class="hidden">
      <span class="ai-banner-icon"></span>
      <span id="ai-banner-text" class="ai-banner-text"></span>
      <button id="ai-banner-action" class="ai-banner-action"></button>
    </div>

    <div id="action-bar" class="hidden">
      <button id="close-duplicates-btn">
        <span class="action-icon" aria-hidden="true"></span>
        <span class="action-text"></span>
      </button>
    </div>

    <div id="groups-toolbar" class="hidden">
      <span class="toolbar-label">Groups</span>
      <button id="toggle-all-btn">Expand all</button>
    </div>

    <div id="groups"></div>
  </div>

  <div id="sessions-view" class="hidden">
    <div id="save-session-bar">
      <input id="session-name-input" type="text" placeholder="Name this session…" maxlength="60">
      <button id="save-session-btn">Save</button>
    </div>

    <div id="session-list"></div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <h3 id="modal-title"></h3>
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn modal-btn-secondary">Cancel</button>
        <button id="modal-confirm" class="modal-btn modal-btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
